name: build-image
on:
  workflow_dispatch:
    inputs:
      tag: {description: "image tag", default: "v1"}
      model: {description: "HF model id baked into /models/qwen", default: "Qwen/Qwen3-4B-Instruct-2507"}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost; df -h /
      - name: crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin crane
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: weights
        run: |
          pip install -q "huggingface_hub>=0.30"
          python3 -c "from huggingface_hub import snapshot_download as s; s('${{ inputs.model }}', local_dir='models/qwen', allow_patterns=['*.json','*.safetensors','*.txt','tokenizer*','merges.txt','vocab.json'])"
          rm -rf models/qwen/.cache; du -sh models/qwen; ls models/qwen
      - name: workdir
        run: sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w && df -h /mnt
      - name: assemble + push
        run: WORK=/mnt/w scripts/assemble.sh ghcr.io/solar-depin-hub/amd-match4-agent:${{ inputs.tag }}
        env: {WORK: /mnt/w}
